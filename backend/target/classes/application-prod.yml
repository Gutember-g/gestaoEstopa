spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:erp_prod}?sslmode=require}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:}
    password: ${DB_PASS:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: WARN
    com.erp.multitenant: INFO

jwt:
  secret: ${JWT_SECRET_PROD}
  expiration: 900000 # 15 minutos (15 * 60 * 1000 ms)
  issuer: ${JWT_ISSUER:gestao-estopa-api}
  audience: ${JWT_AUDIENCE:gestao-estopa-web}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:https://gestao-estopa-pi.vercel.app,https://gestao-estopa-git-*.vercel.app,https://*.vercel.app,http://localhost:5173,http://localhost:3000}

cookie:
  same-site: ${COOKIE_SAME_SITE:None}

